// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.5.0'
        // Firebase's own project (google-services.json) is already wired up
        // for FCM - Crashlytics rides the same project with no extra setup,
        // and is the only way to see a native crash from this app at all
        // right now (a WebView renderer crash is already handled gracefully
        // in MainActivity, but a crash anywhere else in the native shell
        // currently has zero visibility once it leaves a user's device).
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
