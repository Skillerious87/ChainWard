services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chainward
      POSTGRES_PASSWORD: chainward
      POSTGRES_DB: chainward
    ports:
      - "5432:5432"
    volumes:
      - chainward_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainward -d chainward"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chainward_postgres:
